name: Monitor www.pudconsultants.com

# PA-024: runs every hour. A failed run means the site, a key page, the sitemap or the certificate has a problem;
# GitHub emails the repository admins when a scheduled run fails.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Health check
        run: python3 .github/scripts/monitor.py

name: Deploy www.pudconsultants.com to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # site/ is the production build: indexable, canonical to www.pudconsultants.com,
      # with CNAME, .nojekyll and forwarding pages for the old Wix addresses.
      - name: Check the production build
        run: |
          test -f site/CNAME && grep -q 'www.pudconsultants.com' site/CNAME
          ! grep -rl 'noindex,nofollow,noarchive' site --include=index.html

      # Custom domain for an Actions-deployed site lives in the Pages settings, not in the CNAME file.
      - name: Point GitHub Pages at www.pudconsultants.com
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"www.pudconsultants.com"}' -w '\nHTTP %{http_code}\n'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
